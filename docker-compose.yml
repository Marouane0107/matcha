services:
  db:
    image: postgres:16-alpine
    container_name: matcha_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_strong_password}
      POSTGRES_DB: matcha_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema runs automatically on the very first init (empty volume).
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # Optional: uncomment to reach Postgres from the host (e.g. `psql`).
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matcha_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: matcha_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5173
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-your_strong_password}
      DB_NAME: matcha_dev
      DB_CONFIRM_NAME: matcha_dev
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      JWT_EXPIRES_IN: 15m
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "587"
      SMTP_USER: your_smtp_user
      SMTP_PASSWORD: your_smtp_password
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: matcha_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_SOCKET_URL: http://localhost:3000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
